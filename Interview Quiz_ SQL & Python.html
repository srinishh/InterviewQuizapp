 ${Q.length?'<h2>Questions</h2>':''}${Q.map(q=>`<div class="card qi ${q.subj}"><div class="row"><span class="subj ${q.subj}">${q.subj}</span>${lvB(q.lv)}${q.tags.map(tagHtml).join('')}<span class="mute" style="margin-left:auto">Missed ${(S.stats[q.id]||{}).w||1}x, ${dueTxt(S.stats[q.id]||{})}</span></div>
 <div class="qtext" style="font-size:17px">${esc(q.q)}</div><div class="mute">Answer: <b style="color:var(--ok)">${esc(q.opts[q.ans])}</b></div>${q.expl?`<div class="expl">${esc(q.expl)}</div>`:''}${q.note?`<div class="note"><b>Your note:</b> ${esc(q.note)}</div>`:''}
 <div class="row" style="margin-top:12px"><button class="btn alt" data-mq="${q.id}">Mark mastered</button></div></div>`).join('')}
 ${P.length?'<h2>Problems</h2>':''}${P.map(p=>`<div class="card qi ${p.subj}"><div class="row"><span class="subj ${p.subj}">${p.subj}</span>${lvB(p.lv)}${p.tags.map(tagHtml).join('')}<span class="mute" style="margin-left:auto">Missed ${(S.pst[p.id]||{}).w||1}x, ${dueTxt(S.pst[p.id]||{})}</span></div>
 <div class="qtext" style="font-size:17px;margin-bottom:6px">${esc(p.title)}</div>${p.note?`<div class="note"><b>Your note:</b> ${esc(p.note)}</div>`:''}
 <div class="row" style="margin-top:12px"><button class="btn" data-op="${p.id}">Try again</button><button class="btn alt" data-mp="${p.id}">Mark mastered</button></div></div>`).join('')}
 ${!Q.length&&!P.length?'<div class="card">Nothing to revisit. Wrong answers and missed problems will show up here.</div>':''}`;
 $('#rs').onchange=e=>{rf=e.target.value;vRev()};
 if($('#pq'))$('#pq').onclick=()=>{run={qs:(DQ.length?DQ:Q).map(q=>({q,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.q),i:0,score:0,picked:null,miss:{}};tab='quiz';render()};
 if($('#pp'))$('#pp').onclick=()=>{cur=P[0].id;tab='prob';render()};
 document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{cur=b.dataset.op;tab='prob';render()});
 document.querySelectorAll('[data-mq]').forEach(b=>b.onclick=()=>{S.stats[b.dataset.mq].last=1;save();render()});
 document.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>{S.pst[b.dataset.mp].last=1;save();render()});
}
// ---------- Spaced repetition, progress, backup ----------
const isDue=s=>!s.due||s.due<=Date.now();
const dueN=()=>wq().filter(q=>isDue(S.stats[q.id])).length+wp().filter(p=>isDue(S.pst[p.id])).length;
const dueTxt=s=>isDue(s)?'due now':'due in '+Math.ceil((s.due-Date.now())/864e5)+'d';
const IV=[1,3,7,14];
const srUpd=(s,ok)=>{
 if(!ok){s.w=(s.w||0)+1;s.box=0;s.due=Date.now()+IV[0]*864e5;s.last=0}
 else if(s.last===0){s.box=(s.box||0)+1;if(s.box>=IV.length)s.last=1;else s.due=Date.now()+IV[s.box]*864e5}
 else s.last=1;
};
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const logDay=()=>{S.days=S.days||{};const k=dk();S.days[k]=(S.days[k]||0)+1;save()};
S.days=S.days||{};
function vDash(){
 const T={},L={B:[0,0],I:[0,0],A:[0,0]},Sb={SQL:[0,0],Python:[0,0]};let qa=0,qc=0,pdist=0,pgot=0;
 const add=(it,s)=>{if(!s||!s.a)return;const l=L[it.lv||'B']||L.B;l[0]+=s.a;l[1]+=s.c;Sb[it.subj][0]+=s.a;Sb[it.subj][1]+=s.c;it.tags.forEach(t=>{const x=T[t]=T[t]||[0,0];x[0]+=s.a;x[1]+=s.c})};
 S.qs.forEach(q=>{const s=S.stats[q.id];if(s&&s.a){qa+=s.a;qc+=s.c}add(q,s)});
 S.probs.forEach(p=>{const s=S.pst[p.id];if(s&&s.a){pdist++;if(s.last===1)pgot++}add(p,s)});
 let streak=0;const d=new Date();if(!S.days[dk(d)])d.setDate(d.getDate()-1);while(S.days[dk(d)]){streak++;d.setDate(d.getDate()-1)}
 const days=[];for(let i=13;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);days.push([dk(x),S.days[dk(x)]||0])}
 const mx=Math.max(1,...days.map(x=>x[1])),pct=(a,c)=>a?Math.round(c/a*100):0;
 const bar=(lb,a,c,co)=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><b>${lb}</b><span class="mute">${a?c+'/'+a+' right ('+pct(a,c)+'%)':'no attempts yet'}</span></div><div class="bar" style="margin:4px 0 0"><i style="width:${pct(a,c)}%;background:${co}"></i></div></div>`;
 const topics=Object.entries(T).sort((x,y)=>pct(x[1][0],x[1][1])-pct(y[1][0],y[1][1]));
 const weak=topics.filter(([t,v])=>v[0]>=2&&pct(v[0],v[1])<60);
 const fresh=[...new Set([...allTags(),...S.probs.flatMap(p=>p.tags)])].filter(t=>!T[t]).sort();
 const tile=(n,l,c)=>`<div class="card" style="flex:1;min-width:130px;text-align:center;margin:0"><div class="big" style="font-size:34px;color:${c}">${n}</div><div class="mute">${l}</div></div>`;
 $('#app').innerHTML=`<div class="row" style="margin-bottom:14px">${tile(pct(qa,qc)+'%','quiz accuracy ('+qa+' answers)','var(--p)')}${tile(pgot+'/'+pdist,'problems got right','var(--ok)')}${tile(streak,'day streak','#f97316')}${tile(dueN(),'reviews due','var(--bad)')}</div>
 <div class="card"><h2>Last 14 days</h2><div class="row" style="align-items:flex-end;gap:5px;height:80px;flex-wrap:nowrap">${days.map(([k,n])=>`<div title="${k}: ${n}" style="flex:1;height:${Math.max(4,n/mx*100)}%;background:${n?'linear-gradient(#ec4899,#7c3aed)':'var(--line)'};border-radius:6px"></div>`).join('')}</div><p class="mute" style="margin-bottom:0">Each bar is one day of answers and problems.</p></div>
 <div class="card"><h2>By subject and level</h2>${bar('SQL',Sb.SQL[0],Sb.SQL[1],'var(--sql)')}${bar('Python',Sb.Python[0],Sb.Python[1],'var(--py)')}${['B','I','A'].map(k=>bar(LVN[k],L[k][0],L[k][1],LVC[k])).join('')}</div>
 <div class="card"><h2>Needs work</h2>${weak.length?weak.map(([t,v])=>`${tagHtml(t)} <span class="mute">${pct(v[0],v[1])}% over ${v[0]} tries</span>`).join('<br>'):'<span class="mute">No weak topics yet. Topics under 60% with at least 2 tries appear here.</span>'}</div>
 <div class="card"><h2>By topic</h2>${topics.map(([t,v])=>bar(esc(t),v[0],v[1],col(t))).join('')||'<span class="mute">Answer some questions to see topic accuracy.</span>'}${fresh.length?`<p><b>Not started</b></p><div class="row">${fresh.map(tagHtml).join('')}</div>`:''}</div>
 <div class="card"><h2>Backup and restore</h2><p class="mute">Your data lives in this browser only. Export it, copy the text somewhere safe, and paste it here on any device to restore.</p>
 <textarea id="bk" spellcheck="false" style="min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px" placeholder="Press Export, or paste a backup here to restore"></textarea>
 <div class="row" style="margin-top:10px"><button class="btn" id="ex">Export</button><button class="btn alt" id="cp">Copy</button><button class="btn alt" id="rt">Restore from pasted backup</button></div><p id="bm" class="mute" style="margin-bottom:0"></p></div>`;
 $('#ex').onclick=()=>{const b=$('#bk');b.value=JSON.stringify(S);b.focus();b.select();$('#bm').textContent='Backup ready. Press Copy and save the text in a note or file.'};
 $('#cp').onclick=()=>{const b=$('#bk');if(!b.value){$('#bm').textContent='Press Export first.';return}b.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}$('#bm').textContent=ok?'Copied.':'Select the text and copy it manually.'};
 let arm=0;
 $('#rt').onclick=()=>{let o;try{o=JSON.parse($('#bk').value)}catch(e){}
  if(!o||!Array.isArray(o.qs)){arm=0;$('#rt').textContent='Restore from pasted backup';$('#bm').textContent='That does not look like a backup. Paste the full text and try again.';return}
  if(!arm){arm=1;$('#rt').textContent='Click again to replace all current data';return}
  o.stats=o.stats||{};o.pst=o.pst||{};o.att=o.att||{};o.probs=o.probs||[];o.days=o.days||{};S=o;save();render();
 };
}
// ---------- Stars, search, mock interview ----------
S.stars=S.stars||{};
const starB=id=>`<button class="star" data-st="${id}" aria-label="Star this item" title="Star">${(S.stars||{})[id]?'★':'☆'}</button>`;
document.getElementById('app').addEventListener('click',e=>{
 const b=e.target.closest('[data-st]');if(!b)return;
 e.stopPropagation();e.preventDefault();
 S.stars=S.stars||{};const id=b.dataset.st;
 if(S.stars[id])delete S.stars[id];else S.stars[id]=1;
 save();document.querySelectorAll('[data-st="'+id+'"]').forEach(x=>x.textContent=S.stars[id]?'★':'☆');
 if(tab==='search'&&sf.star)renderRes();
},true);

let sf={q:'',type:'All',subj:'All',lv:'All',star:false};
function vSearch(){
 const so=(a,c)=>a.map(s=>`<option ${c===s?'selected':''}>${s}</option>`).join('');
 $('#app').innerHTML=`<div class="card"><input id="sq" placeholder="Search questions, problems, solutions, notes and tags" value="${esc(sf.q)}" autocomplete="off">
 <div class="grid" style="margin-top:8px"><div><label>Show</label><select id="s1">${so(['All','Questions','Problems'],sf.type)}</select></div><div><label>Subject</label><select id="s2">${so(['All','SQL','Python'],sf.subj)}</select></div>
 <div><label>Level</label><select id="s3">${lvOpts(sf.lv,1)}</select></div><div><label>Starred</label><select id="s4"><option value="0">All items</option><option value="1" ${sf.star?'selected':''}>Starred only</option></select></div></div></div><div id="sr"></div>`;
 $('#sq').oninput=e=>{sf.q=e.target.value;renderRes()};
 $('#s1').onchange=e=>{sf.type=e.target.value;renderRes()};$('#s2').onchange=e=>{sf.subj=e.target.value;renderRes()};
 $('#s3').onchange=e=>{sf.lv=e.target.value;renderRes()};$('#s4').onchange=e=>{sf.star=e.target.value==='1';renderRes()};
 renderRes();
}
function renderRes(){
 const t=sf.q.trim().toLowerCase(),f=x=>(sf.subj==='All'||x.subj===sf.subj)&&(sf.lv==='All'||x.lv===sf.lv)&&(!sf.star||S.stars[x.id]),hit=s=>!t||s.toLowerCase().includes(t);
 const Q=sf.type==='Problems'?[]:S.qs.filter(q=>f(q)&&hit([q.q,q.opts.join(' '),q.tags.join(' '),q.note||'',q.expl||''].join(' ')));
 const P=sf.type==='Questions'?[]:S.probs.filter(p=>f(p)&&hit([p.title,p.prompt,p.sol,p.tags.join(' '),p.note||''].join(' ')));
 const n=Q.length+P.length,shown=[...Q.map(x=>({t:'q',x})),...P.map(x=>({t:'p',x}))].slice(0,40);
 $('#sr').innerHTML=`<p class="mute">${n} result${n===1?'':'s'}${n>40?' (showing the first 40)':''}</p>`+shown.map(({t,x})=>t==='q'?
  `<div class="card qi ${x.subj}"><div class="row"><span class="subj ${x.subj}">${x.subj}</span>${lvB(x.lv)}${starB(x.id)}${x.tags.map(tagHtml).join('')}<span class="mute" style="margin-left:auto">Question</span></div><div class="qtext" style="font-size:17px">${esc(x.q)}</div><div class="mute">Answer: <b style="color:var(--ok)">${esc(x.opts[x.ans])}</b></div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div>`
  :`<div class="card qi ${x.subj}"><div class="row"><span class="subj ${x.subj}">${x.subj}</span>${lvB(x.lv)}${starB(x.id)}${x.tags.map(tagHtml).join('')}<span class="mute" style="margin-left:auto">Problem</span></div><div class="qtext" style="font-size:17px;margin-bottom:6px">${esc(x.title)}</div><div class="mute">${esc(x.prompt.slice(0,160))}</div><div class="row" style="margin-top:10px"><button class="btn" data-po="${x.id}">Open problem</button></div></div>`).join('');
 document.querySelectorAll('[data-po]').forEach(b=>b.onclick=()=>{cur=b.dataset.po;tab='prob';render()});
}

let mc={subj:'All',lv:'All',nq:10,np:2,min:30},mk=null,mtimer=null;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const mItems=()=>[...mk.qs.map(x=>({t:'q',x})),...mk.ps.map(x=>({t:'p',x}))];
function vMock(){
 if(mk)return mk.done?vMockRes():vMockRun();
 const so=(a,c)=>a.map(s=>`<option ${String(c)===String(s)?'selected':''}>${s}</option>`).join('');
 $('#app').innerHTML=`<div class="card"><h2>Mock interview</h2><p class="mute">A timed, mixed set with no feedback until you finish, like a real interview. Wrong answers go to Review automatically.</p>
 <div class="grid"><div><label>Subject</label><select id="m1">${so(['All','SQL','Python'],mc.subj)}</select></div><div><label>Level</label><select id="m2">${lvOpts(mc.lv,1)}</select></div>
 <div><label>Questions</label><select id="m3">${so([5,10,15,20],mc.nq)}</select></div><div><label>Problems</label><select id="m4">${so([0,1,2,3,5],mc.np)}</select></div>
 <div><label>Time in minutes</label><select id="m5">${so([10,20,30,45,60],mc.min)}</select></div></div>
 <p id="me" style="color:var(--bad);font-weight:700"></p><button class="btn" id="mg">Start mock interview</button></div>`;
 $('#m1').onchange=e=>mc.subj=e.target.value;$('#m2').onchange=e=>mc.lv=e.target.value;$('#m3').onchange=e=>mc.nq=+e.target.value;$('#m4').onchange=e=>mc.np=+e.target.value;$('#m5').onchange=e=>mc.min=+e.target.value;
 $('#mg').onclick=()=>{
  const f=x=>(mc.subj==='All'||x.subj===mc.subj)&&(mc.lv==='All'||x.lv===mc.lv);
  const qs=shuf(S.qs.filter(f)).slice(0,mc.nq),ps=shuf(S.probs.filter(f)).slice(0,mc.np);
  if(!qs.length&&!ps.length){$('#me').textContent='No items match those filters.';return}
  mk={qs,ps,ans:{},pa:{},pm:{},i:0,t0:Date.now(),end:Date.now()+mc.min*60000,done:false};
  clearInterval(mtimer);mtimer=setInterval(tick,1000);render();
 };
}
function tick(){
 if(!mk||mk.done){clearInterval(mtimer);return}
 if(tab!=='mock')return;
 const r=Math.max(0,mk.end-Date.now()),el=$('#tm');
 if(el){el.textContent=Math.floor(r/60000)+':'+String(Math.floor(r%60000/1000)).padStart(2,'0');el.style.color=r<60000?'var(--bad)':'inherit'}
 if(r<=0)finishMock();
}
function vMockRun(){
 const it=mItems(),n=it.length,c=it[mk.i],x=c.x;
 const done=it.filter(o=>o.t==='q'?mk.ans[o.x.id]!==undefined:(mk.pa[o.x.id]||'').trim()).length;
 $('#app').innerHTML=`<div class="card"><div class="row"><b>Item ${mk.i+1} of ${n}</b><span class="mute">${done} answered</span><b id="tm" style="margin-left:auto;font-size:22px"></b></div>
 <div class="bar" style="margin-top:10px"><i style="width:${(mk.i+1)/n*100}%"></i></div>
 <div class="row"><span class="subj ${x.subj}">${x.subj}</span>${lvB(x.lv)}${x.tags.map(tagHtml).join('')}${starB(x.id)}${c.t==='p'?'<span class="mute">Problem: write your answer</span>':''}</div>
 ${c.t==='q'?`<div class="qtext">${esc(x.q)}</div>${x.opts.map((o,k)=>`<button class="opt ${mk.ans[x.id]===k?'sel':''}" data-k="${k}">${esc(o)}</button>`).join('')}`:`<div class="qtext">${esc(x.title)}</div><div class="prompt">${esc(x.prompt)}</div><textarea class="code" id="pa" spellcheck="false" placeholder="Write your answer">${esc(mk.pa[x.id]||'')}</textarea>`}
 <div class="row" style="margin-top:14px"><button class="btn alt" id="pv" ${mk.i?'':'disabled'}>Previous</button><button class="btn alt" id="nx" ${mk.i<n-1?'':'disabled'}>Next</button><button class="btn del" id="fn" style="margin-left:auto">Finish</button></div></div>`;
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{mk.ans[x.id]=+b.dataset.k;vMockRun()});
 if($('#pa'))$('#pa').oninput=e=>{mk.pa[x.id]=e.target.value};
 $('#pv').onclick=()=>{mk.i--;vMockRun()};$('#nx').onclick=()=>{mk.i++;vMockRun()};
 let arm=0;$('#fn').onclick=()=>{if(!arm){arm=1;$('#fn').textContent='Click again to submit';return}finishMock()};
 tick();
}
function finishMock(){
 if(!mk||mk.done)return;mk.done=true;clearInterval(mtimer);mk.used=Math.min(Date.now(),mk.end)-mk.t0;
 let c=0;
 mk.qs.forEach(q=>{const a=mk.ans[q.id];if(a===undefined)return;const ok=a===q.ans;if(ok)c++;const st=S.stats[q.id]||{a:0,c:0};st.a++;if(ok)st.c++;srUpd(st,ok);S.stats[q.id]=st;logDay()});
 mk.ps.forEach(p=>{const a=(mk.pa[p.id]||'').trim();if(a)S.att[p.id]=a});
 mk.c=c;save();render();
}
function vMockRes(){
 const nq=mk.qs.length,pc=nq?Math.round(mk.c/nq*100):0,m=Math.floor(mk.used/60000),s=String(Math.floor(mk.used%60000/1000)).padStart(2,'0');
 $('#app').innerHTML=`<div class="card" style="text-align:center"><h2>Mock interview finished</h2><div class="big" style="color:var(--p)">${mk.c}/${nq}</div><p class="mute">${pc}% on questions, time used ${m}:${s}${mk.ps.length?', '+mk.ps.filter(p=>(mk.pa[p.id]||'').trim()).length+' of '+mk.ps.length+' problems attempted':''}</p>
 <button class="btn" id="nm">New mock interview</button></div>
 ${mk.qs.map(q=>{const a=mk.ans[q.id],ok=a===q.ans;return `<div class="card qi ${q.subj}"><div class="row"><span class="subj ${q.subj}">${q.subj}</span>${lvB(q.lv)}${starB(q.id)}${q.tags.map(tagHtml).join('')}<b style="margin-left:auto;color:${ok?'var(--ok)':'var(--bad)'}">${a===undefined?'Skipped':ok?'Correct':'Wrong'}</b></div><div class="qtext" style="font-size:17px">${esc(q.q)}</div>${a!==undefined&&!ok?`<div class="mute">Your answer: ${esc(q.opts[a])}</div>`:''}<div class="mute">Answer: <b style="color:var(--ok)">${esc(q.opts[q.ans])}</b></div>${q.expl?`<div class="expl">${esc(q.expl)}</div>`:''}</div>`}).join('')}
 ${mk.ps.map(p=>`<div class="card qi ${p.subj}"><div class="row"><span class="subj ${p.subj}">${p.subj}</span>${lvB(p.lv)}${starB(p.id)}${p.tags.map(tagHtml).join('')}<span class="mute" style="margin-left:auto">Problem</span></div><div class="qtext" style="font-size:17px;margin-bottom:6px">${esc(p.title)}</div><div class="prompt">${esc(p.prompt)}</div><b>Your answer</b><pre class="code">${esc((mk.pa[p.id]||'').trim()||'(no answer)')}</pre><b>Solution</b><pre class="code">${esc(p.sol)}</pre>
 <div class="row"><button class="btn" data-pm="${p.id}" data-v="1">I got it</button><button class="btn del" data-pm="${p.id}" data-v="0">I missed it</button><span class="mute"></span></div></div>`).join('')}`;
 $('#nm').onclick=()=>{mk=null;render()};
 document.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.pm,ok=b.dataset.v==='1',s=S.pst[id]||{a:0,c:0,w:0};
  if(!mk.pm[id]){s.a++;if(ok)s.c++;srUpd(s,ok);logDay()}else{s.last=ok?1:0;if(!ok){s.box=0;s.due=Date.now()+864e5}}
  mk.pm[id]=1;S.pst[id]=s;save();b.parentNode.querySelector('.mute').textContent=ok?'Marked as got it':'Saved to Review';nav();
 });
 nav();
}
render();
</script>
</body>
